<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>2nd Quarter | Drill 2</title>
    <style>
        :root {
            --gold: #e8b43c;
            --gold-light: #f5cf62;
            --blue: #1f4fb5;
            --blue-bright: #2a63d6;
            --blue-deep: #12337c;
            --ink: #0b0c10;
            --panel: #1e1f24;
            --field: #0f1015;
            --muted: #a9adb8;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            background:
                radial-gradient(ellipse 70% 45% at 50% 0%, rgba(42, 99, 214, 0.38), transparent 70%),
                linear-gradient(180deg, #0d1018 0%, var(--ink) 100%);
            background-attachment: fixed;
        }

        main {
            flex: 1;
            padding: 4rem 1rem 3rem;
        }

        /* Header */
        .site-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.9rem, 6vw, 4.2rem);
            letter-spacing: 0.12em;
            text-align: center;
            color: var(--gold);
            text-shadow: 0 0 28px rgba(232, 180, 60, 0.45);
            margin: 0;
            line-height: 1.1;
        }

        .site-subtitle {
            text-align: center;
            font-size: clamp(0.85rem, 2.2vw, 1.25rem);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #d6d8df;
            margin: 0.6rem 0 3.2rem;
        }

        /* Card */
        .checker-card {
            max-width: 760px;
            margin: 0 auto;
            padding: 3.6rem 3rem 3.2rem;
            background: linear-gradient(180deg, #232429 0%, #1a1b20 100%);
            border: 2px solid var(--gold);
            border-top: 10px solid var(--blue);
            border-radius: 22px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55), 0 0 60px rgba(42, 99, 214, 0.12);
        }

        .checker-card .form-control {
            background-color: var(--field);
            color: #fff;
            border: 1px solid #2e3039;
            border-radius: 12px;
            padding: 1.35rem 1.4rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.45rem;
            font-weight: 500;
        }

        .checker-card .form-control::placeholder {
            color: var(--muted);
            opacity: 1;
        }

        .checker-card .form-control:focus {
            background-color: var(--field);
            color: #fff;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(232, 180, 60, 0.25);
        }

        .btn-enter {
            display: block;
            width: 100%;
            padding: 1.7rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 0.14em;
            color: var(--gold-light);
            background: linear-gradient(180deg, var(--blue-bright) 0%, var(--blue-deep) 100%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .btn-enter:hover {
            filter: brightness(1.12);
            box-shadow: 0 0 24px rgba(42, 99, 214, 0.55);
        }

        .btn-enter:active {
            transform: translateY(1px);
        }

        .btn-enter:focus-visible {
            outline: 3px solid var(--gold-light);
            outline-offset: 3px;
        }

        /* Result area (filled by main.py) */
        #output {
            max-width: 760px;
            margin: 1.8rem auto 0;
            padding: 1rem 1.4rem;
            border-radius: 12px;
            background-color: rgba(18, 51, 124, 0.35);
            border: 1px solid rgba(42, 99, 214, 0.6);
            color: var(--gold-light);
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
        }

        #output:empty {
            display: none;
        }

        /* Footer */
        footer {
            border-top: 6px solid var(--gold);
            background: linear-gradient(90deg, #0f2a6b 0%, #1f4fb5 50%, #0f2a6b 100%);
            text-align: center;
            padding: 2.2rem 1rem;
            font-size: 1.5rem;
            letter-spacing: 0.06em;
            color: #e6e8ee;
        }

        footer strong {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--gold-light);
        }

        footer .dot {
            margin: 0 0.5rem;
            color: var(--gold-light);
        }

        @media (max-width: 576px) {
            .checker-card { padding: 2rem 1.4rem; }
            .btn-enter { font-size: 1.3rem; padding: 1.2rem 1rem; }
            footer { font-size: 1.05rem; }
            footer strong { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <main>
        <h1 class="site-title">Sports Club Checker</h1>
        <p class="site-subtitle">Candidate Verification System</p>

        <div class="container">
            <form class="checker-card" onsubmit="return false;">
                <div class="mb-4">
                    <input type="text" id="first_name" class="form-control" placeholder="Enter your First Name" autocomplete="off">
                </div>
                <div class="mb-4">
                    <input type="text" id="last_name" class="form-control" placeholder="Enter your Last Name" autocomplete="off">
                </div>
                <button type="button" py-click="result_checker" class="btn-enter">ENTER</button>
            </form>

            <div id="output"></div>
        </div>
    </main>

    <footer>
        &copy; 2026 <strong>Sports Club</strong><span class="dot">&bull;</span>Seatwork 1<span class="dot">&bull;</span>2nd Quarter
    </footer>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
